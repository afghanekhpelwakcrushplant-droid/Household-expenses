<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365D">
<title>مصارف خانه</title>

<style>
:root{
  --navy:#424242;
  --teal:#00A898;
  --mint:#E7F8F5;
  --bg:#F4F8F7;
  --gold:#FFC00E;
  --red:#F8D7DA;
  --green:#D9EAD3;
  --text:#303838;
  --border:#d9e7e7;
  --white:#ffffff;
  --shadow:0 7px 22px rgba(23,54,93,.09);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,#e2f7f3 0,transparent 36%),
    linear-gradient(160deg,#f1f8f7,#fff);
  font-family:Arial,"Noto Sans Arabic","Tahoma",sans-serif;
  color:var(--text);
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  border:0;
  border-radius:14px;
  padding:13px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.18s ease;
}

button:active{
  transform:scale(.97);
}

.app{
  max-width:560px;
  margin:auto;
  padding:14px 13px 38px;
}

.header{
  background:linear-gradient(135deg,#424242,#00A898);
  color:white;
  border-radius:24px;
  padding:24px 18px;
  text-align:center;
  box-shadow:0 10px 28px rgba(23,54,93,.18);
  position:relative;
  overflow:hidden;
}

.header:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  left:-45px;
  top:-55px;
}

.header h1{
  margin:0;
  font-size:27px;
  position:relative;
  z-index:1;
}

.header p{
  margin:7px 0 0;
  font-size:13px;
  opacity:.9;
  position:relative;
  z-index:1;
}

.card{
  background:rgba(255,255,255,.97);
  border-radius:20px;
  padding:17px;
  margin-top:14px;
  box-shadow:var(--shadow);
  border:1px solid rgba(217,231,231,.9);
}

.total{
  font-size:29px;
  font-weight:800;
  text-align:center;
  color:var(--teal);
  margin:7px 0 2px;
  direction:rtl;
}

.total-label{
  text-align:center;
  color:#68777c;
  font-size:12px;
}

.month-label{
  text-align:center;
  color:#53656a;
  font-size:12px;
  margin-top:4px;
}

label{
  display:block;
  font-weight:700;
  margin:13px 0 6px;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #cfe0e0;
  border-radius:13px;
  font-size:16px;
  background:#fbfefe;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(15,107,120,.08);
}

textarea{
  min-height:75px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.primary{
  width:100%;
  background:#00A898;
  color:white;
}

.secondary{
  background:#424242;
  color:white;
}

.gold{
  background:#FFC00E;
  color:#303030;
}

.danger{
  background:var(--red);
  color:#7a2525;
}

.success{
  background:var(--green);
  color:#315b2b;
}

.light{
  background:#edf4f4;
  color:var(--navy);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin:2px 0 13px;
}

.hidden{
  display:none!important;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:11px;
}

.actions button{
  flex:1;
  min-width:120px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #edf2f2;
  font-size:13px;
}

.row:last-child{
  border-bottom:0;
}

.amount{
  font-weight:800;
  white-space:nowrap;
  color:var(--navy);
}

.bar{
  height:8px;
  background:#edf4f4;
  border-radius:10px;
  overflow:hidden;
  margin-top:7px;
}

.bar>span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--teal),#2b8992);
  border-radius:10px;
}

.small{
  font-size:11px;
  color:#66777b;
}

.muted{
  text-align:center;
  color:#68777c;
  font-size:12px;
  padding:10px 0;
}

.toast{
  position:fixed;
  bottom:20px;
  right:50%;
  transform:translateX(50%);
  background:#17365D;
  color:white;
  padding:12px 18px;
  border-radius:13px;
  display:none;
  z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  font-size:14px;
  max-width:90%;
  text-align:center;
}

.category-box{
  margin-top:12px;
  padding:12px;
  border:1px solid #dce9e9;
  border-radius:15px;
  background:#f9fcfc;
}

.category-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #e8eeee;
}

.category-item:last-child{
  border-bottom:0;
}

.category-name{
  font-weight:700;
  font-size:14px;
}

.delete-cat{
  padding:8px 11px;
  min-width:auto;
  font-size:12px;
  background:var(--red);
  color:#7a2525;
}

.date-display{
  background:#fbfefe;
  border:1px solid #cfe0e0;
  border-radius:13px;
  padding:13px;
  font-size:16px;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
}

.date-display span{
  color:var(--text);
}

.date-display .calendar-icon{
  font-size:19px;
}

.jalali-month-select{
  width:100%;
}

.report-summary{
  background:linear-gradient(135deg,#edf8f7,#fff);
  border-radius:15px;
  padding:13px;
  margin-bottom:10px;
  text-align:center;
}

.report-summary strong{
  display:block;
  color:var(--teal);
  font-size:20px;
  margin-top:4px;
}

.management-title{
  margin-top:18px;
  font-size:14px;
  font-weight:800;
}

.note-box{
  background:#f5f9f9;
  border-radius:12px;
  padding:10px;
  margin-top:8px;
  font-size:11px;
  color:#607176;
  line-height:1.8;
}

@media(max-width:380px){
  .grid{
    grid-template-columns:1fr;
  }

  .app{
    padding-left:9px;
    padding-right:9px;
  }

  .card{
    padding:14px;
  }
}

<body>

<div class="app">

  <div class="header">
    <h1>مصارف خانه</h1>
    <p>ثبت سریع و ساده هزینه‌های ماهانه</p>
  </div>

  <div class="card">
    <div class="total-label">مجموع مصرف این ماه</div>
    <div class="total" id="total">۰</div>
    <div class="month-label" id="currentMonthLabel"></div>

    <div class="grid">
      <button class="primary" onclick="show('form')">➕ ثبت هزینه</button>
      <button class="secondary" onclick="show('report')">📊 گزارش</button>
    </div>
  </div>

  <!-- فرم ثبت هزینه -->
  <section id="form" class="card hidden">

    <div class="section-title">ثبت هزینه</div>

    <label>تاریخ</label>

    <div
      id="dateDisplay"
      class="date-display"
      onclick="openDatePicker()"
      role="button"
      tabindex="0"
    >
      <span id="dateDisplayText"></span>
      <span class="calendar-icon">📅</span>
    </div>

    <!-- تاریخ واقعی برای سازگاری و انتخاب تاریخ -->
    <input
      id="date"
      type="date"
      style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none"
      tabindex="-1"
    >

    <label>مبلغ</label>
    <input
      id="amount"
      type="number"
      inputmode="numeric"
      min="0"
      placeholder="مثلاً ۵۰۰۰۰۰"
    >

    <label>نوع هزینه</label>
    <select id="category"></select>

    <label>توضیحات</label>
    <textarea
      id="note"
      placeholder="توضیح کوتاه"
    ></textarea>

    <button class="primary" onclick="addExpense()">✓ ثبت هزینه</button>

    <div class="actions">
      <button class="gold" onclick="show('home')">خانه</button>
      <button class="danger" onclick="clearForm()">پاک کردن</button>
    </div>

  </section>

  <!-- گزارش -->
  <section id="report" class="card hidden">

    <div class="section-title">گزارش ماهانه</div>

    <label>ماه شمسی</label>
    <select id="month" class="jalali-month-select" onchange="render()"></select>

    <div id="reportSummary"></div>

    <div id="categories"></div>

    <div class="management-title">مدیریت نوع هزینه</div>

    <div class="actions">
      <button class="success" onclick="showAddCategory()">➕ افزودن نوع هزینه</button>
    </div>

    <div id="addCategoryBox" class="category-box hidden">

      <label>نام نوع هزینه جدید</label>

      <input
        id="newCategory"
        type="text"
        maxlength="50"
        placeholder="مثلاً خرید پوشاک"
      >

      <div class="actions">
        <button class="success" onclick="addCategory()">ذخیره نوع هزینه</button>
        <button class="light" onclick="hideAddCategory()">انصراف</button>
      </div>

    </div>

    <div id="categoryManagement" class="category-box"></div>

    <div class="actions">
      <button class="secondary" onclick="downloadCSV()">خروجی Excel (CSV)</button>
      <button class="danger" onclick="clearAll()">حذف همه اطلاعات</button>
    </div>

    <div class="note-box">
      نوع هزینه‌ای که قبلاً برای یک هزینه استفاده شده باشد، قابل حذف نیست.
      این محدودیت برای جلوگیری از خراب شدن اطلاعات قبلی اعمال شده است.
    </div>

  </section>

  <!-- آخرین هزینه‌ها -->
  <div class="card">

    <div class="section-title">آخرین هزینه‌ها</div>

    <div id="recent"></div>

  </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   تنظیمات اصلی
========================================================= */

const key = "home_expenses_v1";

const categoryKey = "home_expense_categories_v1";

const defaultCats = [
  "تنقلات آیلین",
  "خانه بازی آیلین",
  "لباس علی",
  "لباس ساجی",
  "لباس آیلین",
  "بنزین",
  "میوه",
  "رستوران",
  "دارو",
  "خرید خانه مامان",
  "دکتر و بهداشت",
  "اسنپ",
  "قبض",
  "اجاره",
  "درمان",
  "تفریح",
  "سایر"
];

const fa = n =>
  new Intl.NumberFormat("fa-IR").format(Number(n) || 0);


/* =========================================================
   تبدیل اعداد انگلیسی و فارسی
========================================================= */

function toEnglishDigits(value){

  if(value === null || value === undefined) return "";

  return String(value)
    .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
    .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
}


/* =========================================================
   توابع تقویم جلالی
========================================================= */

function div(a,b){
  return Math.floor(a/b);
}

function gregorianToJalali(gy,gm,gd){

  const gdm = [
    0,31,59,90,120,151,
    181,212,243,273,304,334
  ];

  let jy;

  if(gy > 1600){
    jy = 979;
    gy -= 1600;
  }else{
    jy = 0;
    gy -= 621;
  }

  const gy2 = gm > 2 ? gy + 1 : gy;

  let days =
    365 * gy +
    div(gy2 + 3,4) -
    div(gy2 + 99,100) +
    div(gy2 + 399,400) -
    80 +
    gd +
    gdm[gm - 1];

  jy += 33 * div(days,12053);
  days %= 12053;

  jy += 4 * div(days,1461);
  days %= 1461;

  if(days > 365){
    jy += div(days - 1,365);
    days = (days - 1) % 365;
  }

  let jm;

  if(days < 186){
    jm = 1 + div(days,31);
  }else{
    jm = 7 + div(days - 186,30);
  }

  const jd =
    1 +
    (days < 186
      ? days % 31
      : (days - 186) % 30);

  return [jy,jm,jd];
}


function jalaliToGregorian(jy,jm,jd){

  jy = Number(jy);
  jm = Number(jm);
  jd = Number(jd);

  let gy;

  if(jy > 979){
    gy = 1600;
    jy -= 979;
  }else{
    gy = 621;
  }

  let days =
    365 * jy +
    div(jy,33) * 8 +
    div((jy % 33) + 3,4) +
    78 +
    jd +
    (jm < 7
      ? (jm - 1) * 31
      : (jm - 7) * 30 + 186);

  gy += 400 * div(days,146097);
  days %= 146097;

  if(days > 36524){
    gy += 100 * div(--days,36524);
    days %= 36524;

    if(days >= 365){
      days++;
    }
  }

  gy += 4 * div(days,1461);
  days %= 1461;

  if(days > 365){
    gy += div(days - 1,365);
    days = (days - 1) % 365;
  }

  let gd = days + 1;

  const sal_a = [
    0,
    31,
    ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0)
      ? 29
      : 28,
    31,30,31,30,31,31,30,31,30,31
  ];

  let gm;

  for(gm = 1; gm <= 12; gm++){

    if(gd <= sal_a[gm]){
      break;
    }

    gd -= sal_a[gm];
  }

  return [gy,gm,gd];
}


function isoToJalali(iso){

  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)){
    return null;
  }

  const p = iso.split("-").map(Number);

  return gregorianToJalali(
    p[0],
    p[1],
    p[2]
  );
}


function jalaliTextFromIso(iso){

  const j = isoToJalali(iso);

  if(!j) return iso || "";

  return `${fa(j[2])} ${jalaliMonthName(j[1])} ${fa(j[0])}`;
}


const jalaliMonths = [
  "فروردین",
  "اردیبهشت",
  "خرداد",
  "تیر",
  "مرداد",
  "شهریور",
  "مهر",
  "آبان",
  "آذر",
  "دی",
  "بهمن",
  "اسفند"
];


function jalaliMonthName(m){
  return jalaliMonths[m - 1] || "";
}


function jalaliMonthDays(year,month){

  if(month <= 6) return 31;

  if(month <= 11) return 30;

  return isJalaliLeap(year) ? 30 : 29;
}


function isJalaliLeap(year){

  const g = jalaliToGregorian(year,12,1);

  const next = jalaliToGregorian(year + 1,1,1);

  const currentDate =
    new Date(g[0],g[1]-1,g[2]);

  const nextDate =
    new Date(next[0],next[1]-1,next[2]);

  return Math.round(
    (nextDate-currentDate) / 86400000
  ) > 365;
}


/* =========================================================
   تاریخ امروز
========================================================= */

function getTodayISO(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


const todayISO = getTodayISO();

const todayJ = isoToJalali(todayISO);


/* =========================================================
   ذخیره و دریافت اطلاعات
========================================================= */

function get(){

  try{

    const data =
      JSON.parse(localStorage.getItem(key) || "[]");

    return Array.isArray(data) ? data : [];

  }catch(e){

    return [];
  }
}


function save(data){

  const serialized = JSON.stringify(data);

  try{
    const old = localStorage.getItem(key);

    if(old){
      localStorage.setItem(
        "home_expenses_backup_v1",
        old
      );
    }

    localStorage.setItem(key, serialized);

  }catch(e){

    console.error("خطا در ذخیره اطلاعات:",e);

    try{
      localStorage.setItem(
        "home_expenses_backup_v1",
        serialized
      );
    }catch(ignore){}

    throw e;
  }
}


/* =========================================================
   مدیریت نوع هزینه
========================================================= */

function getCategories(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(categoryKey) || "null"
      );

    if(Array.isArray(saved) && saved.length){
      return saved;
    }

  }catch(e){}

  return [...defaultCats];
}


function saveCategories(cats){

  localStorage.setItem(
    categoryKey,
    JSON.stringify(cats)
  );
}


/*
   اگر نسخه قبلی اطلاعات داشته باشد،
   دسته‌بندی‌هایی که در آن اطلاعات استفاده شده‌اند
   ولی در فهرست فعلی نیستند، دوباره به فهرست اضافه می‌شوند.
*/

function syncCategories(){

  let cats = getCategories();

  const expenses = get();

  expenses.forEach(e => {

    if(
      e.category &&
      !cats.includes(e.category)
    ){
      cats.push(e.category);
    }

  });

  saveCategories(cats);

  return cats;
}


/* =========================================================
   پر کردن فهرست نوع هزینه
========================================================= */

function renderCategorySelect(){

  const select =
    document.getElementById("category");

  const cats =
    syncCategories();

  select.innerHTML =
    cats.map(c =>
      `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`
    ).join("");
}


/* =========================================================
   جلوگیری از HTML ناخواسته
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   نمایش تاریخ
========================================================= */

function updateDateDisplay(){

  const value =
    document.getElementById("date").value;

  document.getElementById(
    "dateDisplayText"
  ).textContent =
    jalaliTextFromIso(value);

}


/* =========================================================
   انتخاب تاریخ
========================================================= */

function openDatePicker(){

  const input =
    document.getElementById("date");

  try{

    if(typeof input.showPicker === "function"){
      input.showPicker();
    }else{
      input.click();
    }

  }catch(e){

    input.click();

  }

}


document
  .getElementById("date")
  .addEventListener(
    "change",
    updateDateDisplay
  );


/* =========================================================
   ماه شمسی گزارش
========================================================= */

function buildMonthList(){

  const select =
    document.getElementById("month");

  select.innerHTML = "";

  /*
     چند سال اطراف سال فعلی ایجاد می‌کنیم.
     اطلاعات قدیمی نیز در این بازه قابل مشاهده است.
  */

  for(
    let y = todayJ[0] - 5;
    y <= todayJ[0] + 2;
    y++
  ){

    for(let m=1;m<=12;m++){

      const option =
        document.createElement("option");

      option.value =
        `${y}-${String(m).padStart(2,"0")}`;

      option.textContent =
        `${jalaliMonthName(m)} ${fa(y)}`;

      select.appendChild(option);

    }

  }

  select.value =
    `${todayJ[0]}-${String(todayJ[1]).padStart(2,"0")}`;
}


/* =========================================================
   تبدیل ISO به ماه شمسی
========================================================= */

function isoToJalaliMonth(iso){

  const j = isoToJalali(iso);

  if(!j) return "";

  return `${j[0]}-${String(j[1]).padStart(2,"0")}`;
}


/* =========================================================
   نمایش بخش‌ها
========================================================= */

function show(which){

  document
    .getElementById("form")
    .classList.toggle(
      "hidden",
      which !== "form"
    );

  document
    .getElementById("report")
    .classList.toggle(
      "hidden",
      which !== "report"
    );

  if(which === "report"){
    render();
  }

  if(which === "form"){
    updateDateDisplay();
    renderCategorySelect();
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   ثبت هزینه
========================================================= */

function addExpense(){

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const date =
    document.getElementById("date").value;

  const category =
    document.getElementById("category").value;

  const note =
    document
      .getElementById("note")
      .value
      .trim();

  if(!amount || amount < 0){

    toast("مبلغ را وارد کنید");

    return;
  }

  if(!date){

    toast("تاریخ را انتخاب کنید");

    return;
  }

  if(!category){

    toast("نوع هزینه را انتخاب کنید");

    return;
  }

  const data = get();

  /*
     ساختار اصلی داده حفظ شده است.
     کلید home_expenses_v1 بدون تغییر باقی می‌ماند.
  */

  data.push({
    date:date,
    amount:amount,
    category:category,
    note:note,
    created:Date.now()
  });

  save(data);

  clearForm();

  toast("هزینه با موفقیت ثبت شد");

  render();

}


/* =========================================================
   پاک کردن فرم
========================================================= */

function clearForm(){

  document.getElementById("amount").value = "";

  document.getElementById("note").value = "";

  document.getElementById("date").value =
    getTodayISO();

  renderCategorySelect();

  document.getElementById("category").selectedIndex = 0;

  updateDateDisplay();

}


/* =========================================================
   گزارش
========================================================= */

function render(){

  const selectedMonth =
    document.getElementById("month").value;

  const all =
    get();

  const monthly =
    all.filter(e =>
      isoToJalaliMonth(e.date) === selectedMonth
    );

  const total =
    monthly.reduce(
      (sum,e) =>
        sum + Number(e.amount || 0),
      0
    );

  document.getElementById(
    "total"
  ).textContent = fa(total);


  const monthParts =
    selectedMonth.split("-");

  if(monthParts.length === 2){

    document.getElementById(
      "currentMonthLabel"
    ).textContent =
      `${jalaliMonthName(Number(monthParts[1]))} ${fa(monthParts[0])}`;

  }


  document.getElementById(
    "reportSummary"
  ).innerHTML = `
    <div class="report-summary">
      <div class="small">مجموع هزینه‌های این ماه</div>
      <strong>${fa(total)}</strong>
    </div>
  `;


  /* -------------------------
     جمع‌بندی نوع هزینه
  ------------------------- */

  const cats =
    syncCategories();

  const sums =
    cats
      .map(category => [

        category,

        monthly
          .filter(e =>
            e.category === category
          )
          .reduce(
            (sum,e) =>
              sum + Number(e.amount || 0),
            0
          )

      ])
      .filter(item => item[1] > 0)
      .sort(
        (a,b) => b[1] - a[1]
      );


  const max =
    sums[0]?.[1] || 1;


  document.getElementById(
    "categories"
  ).innerHTML =
    sums.length

    ?

    sums.map(item => `

      <div class="row">

        <div style="flex:1">

          <b>${escapeHtml(item[0])}</b>

          <div class="bar">

            <span
              style="
                width:${Math.max(
                  3,
                  item[1] / max * 100
                )}%
              "
            ></span>

          </div>

        </div>

        <div class="amount">
          ${fa(item[1])}
        </div>

      </div>

    `).join("")

    :

    "<div class='muted'>برای این ماه هزینه‌ای ثبت نشده است.</div>";


  /* -------------------------
     آخرین هزینه‌ها
  ------------------------- */

  const recent =
    all
      .sort(
        (a,b) =>
          Number(b.created || 0) -
          Number(a.created || 0)
      )
      .slice(0,12);


  document.getElementById(
    "recent"
  ).innerHTML =

    recent.length

    ?

    recent.map(e => `

      <div class="row">

        <div>

          <b>
            ${escapeHtml(e.category)}
          </b>

          <br>

          <span class="small">

            ${escapeHtml(
              jalaliTextFromIso(e.date)
            )}

            ${
              e.note
                ? " — " + escapeHtml(e.note)
                : ""
            }

          </span>

        </div>

        <div class="amount">
          ${fa(e.amount)}
        </div>

      </div>

    `).join("")

    :

    "<div class='muted'>هنوز هزینه‌ای ثبت نشده است.</div>";


  renderCategoryManagement();

}


/* =========================================================
   افزودن نوع هزینه
========================================================= */

function showAddCategory(){

  document
    .getElementById("addCategoryBox")
    .classList.remove("hidden");

  document
    .getElementById("newCategory")
    .value = "";

  document
    .getElementById("newCategory")
    .focus();

}


function hideAddCategory(){

  document
    .getElementById("addCategoryBox")
    .classList.add("hidden");

}


function addCategory(){

  const input =
    document.getElementById("newCategory");

  const name =
    input.value.trim();

  if(!name){

    toast("نام نوع هزینه را وارد کنید");

    return;
  }

  let cats =
    syncCategories();

  if(
    cats.some(
      c =>
        c.trim().toLowerCase() ===
        name.toLowerCase()
    )
  ){

    toast("این نوع هزینه قبلاً وجود دارد");

    return;
  }

  cats.push(name);

  saveCategories(cats);

  renderCategorySelect();

  renderCategoryManagement();

  hideAddCategory();

  toast("نوع هزینه جدید اضافه شد");

}


/* =========================================================
   مدیریت و حذف نوع هزینه
========================================================= */

function renderCategoryManagement(){

  const container =
    document.getElementById(
      "categoryManagement"
    );

  if(!container) return;

  const cats =
    syncCategories();

  const expenses =
    get();

  container.innerHTML = `
    <div class="small" style="margin-bottom:7px">
      فهرست نوع هزینه‌ها
    </div>

    ${
      cats.map(category => {

        const used =
          expenses.some(
            e =>
              e.category === category
          );

        return `

          <div class="category-item">

            <div class="category-name">
              ${escapeHtml(category)}
            </div>

            ${
              used

              ?

              `<button
                class="delete-cat"
                disabled
                title="این نوع هزینه قبلاً استفاده شده است"
                style="opacity:.45;cursor:not-allowed"
              >
                🔒 استفاده شده
              </button>`

              :

              `<button
                class="delete-cat"
                onclick="deleteCategory(${JSON.stringify(category).replace(/"/g,'&quot;')})"
              >
                🗑 حذف
              </button>`
            }

          </div>

        `;

      }).join("")
    }
  `;

}


function deleteCategory(category){

  const expenses =
    get();

  /*
     قانون اصلی:
     اگر حتی یک رکورد از این نوع هزینه استفاده کرده باشد،
     حذف ممنوع است.
  */

  const used =
    expenses.some(
      e =>
        e.category === category
    );

  if(used){

    toast(
      "این نوع هزینه قبلاً استفاده شده و قابل حذف نیست"
    );

    return;
  }


  if(
    !confirm(
      `نوع هزینه «${category}» حذف شود؟`
    )
  ){

    return;
  }


  let cats =
    syncCategories();

  cats =
    cats.filter(
      c =>
        c !== category
    );

  saveCategories(cats);

  renderCategorySelect();

  renderCategoryManagement();

  toast("نوع هزینه حذف شد");

}


/* =========================================================
   خروجی CSV
========================================================= */

function downloadCSV(){

  const rows = [
    [
      "تاریخ",
      "مبلغ",
      "نوع هزینه",
      "توضیحات"
    ],

    ...get().map(e => [

      /*
         برای سازگاری با نسخه قبلی،
         تاریخ ذخیره‌شده Gregorian در CSV حفظ می‌شود.
      */

      e.date,

      e.amount,

      e.category,

      e.note

    ])
  ];


  const csv =
    "\ufeff" +

    rows
      .map(row =>
        row
          .map(value =>
            `"${String(value ?? "")
              .replaceAll('"','""')}"`
          )
          .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "مصارف-خانه.csv";

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(
    () =>
      URL.revokeObjectURL(url),
    1000
  );

}

/* =========================================================
   پیام
========================================================= */

function toast(text){

  const element =
    document.getElementById("toast");

  element.textContent = text;

  element.style.display = "block";

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {
        element.style.display = "none";
      },
      2200
    );

}
