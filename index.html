<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365D">
<title>مصارف خانه</title>
<style>
:root{--navy:#17365D;--teal:#0F6B78;--mint:#DFF3F1;--bg:#F6FAFA;--gold:#F4B183;--red:#F4CCCC;--text:#253238}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#eef8f7,#fff);font-family:Arial,"Noto Sans Arabic",sans-serif;color:var(--text)}
.app{max-width:520px;margin:auto;padding:18px 14px 36px}.header{background:linear-gradient(135deg,var(--navy),var(--teal));color:white;border-radius:22px;padding:22px;text-align:center;box-shadow:0 8px 24px #17365d22}.header h1{margin:0;font-size:27px}.header p{margin:7px 0 0;font-size:13px;opacity:.9}
.card{background:white;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 5px 18px #17365d12;border:1px solid #e5eeee}
.total{font-size:28px;font-weight:800;text-align:center;color:var(--teal);margin:8px 0}.muted{text-align:center;color:#68777c;font-size:12px}
label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border:1px solid #cfe0e0;border-radius:12px;font-size:16px;background:#fbfefe}textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{width:100%;background:var(--teal);color:white;margin-top:14px}.secondary{background:var(--navy);color:white}.gold{background:var(--gold);color:#17365D}.danger{background:var(--red);color:#7a2525}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-title{font-size:18px;font-weight:800;margin:2px 0 12px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #edf2f2;font-size:13px}.row:last-child{border-bottom:0}.amount{font-weight:800}.bar{height:9px;background:#edf4f4;border-radius:10px;overflow:hidden;margin-top:6px}.bar>span{display:block;height:100%;background:var(--teal);border-radius:10px}.hidden{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17365D;color:white;padding:12px 18px;border-radius:12px;display:none;z-index:10}.small{font-size:11px;color:#667}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:120px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصارف خانه">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>
<div class="app">
  <div class="header">
    <h1>مصارف خانه</h1>
    <p>ثبت سریع و ساده هزینه‌های ماهانه</p>
  </div>

  <div class="card">
    <div class="muted">مجموع مصرف این ماه</div>
    <div class="total" id="total">۰</div>
    <div class="grid">
      <button class="primary" onclick="show('form')">➕ ثبت هزینه</button>
      <button class="secondary" onclick="show('report')">📊 گزارش</button>
    </div>
  </div>

  <section id="form" class="card hidden">
    <div class="section-title">ثبت هزینه</div>
    <label>تاریخ</label><input id="date" type="date">
    <label>مبلغ</label><input id="amount" type="number" inputmode="numeric" min="0" placeholder="مثلاً ۵۰۰۰۰۰">
    <label>نوع هزینه</label>
    <select id="category"></select>
    <label>توضیحات</label><textarea id="note" placeholder="توضیح کوتاه"></textarea>
    <button class="primary" onclick="addExpense()">✓ ثبت هزینه</button>
    <div class="actions"><button class="gold" onclick="show('home')">خانه</button><button class="danger" onclick="clearForm()">پاک کردن</button></div>
  </section>

  <section id="report" class="card hidden">
    <div class="section-title">گزارش ماهانه</div>
    <label>ماه</label><input id="month" type="month" onchange="render()">
    <div id="categories"></div>
    <div class="actions">
      <button class="secondary" onclick="downloadCSV()">خروجی Excel (CSV)</button>
      <button class="danger" onclick="clearAll()">حذف همه اطلاعات</button>
    </div>
    <p class="small">اطلاعات روی همین گوشی ذخیره می‌شود. برای انتقال به Excel از خروجی CSV استفاده کنید.</p>
  </section>

  <div class="card">
    <div class="section-title">آخرین هزینه‌ها</div>
    <div id="recent"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const cats=["تنقلات آیلین","خانه بازی آیلین","لباس علی","لباس ساجی","لباس آیلین","بنزین","میوه","رستوران","دارو","خرید خانه مامان","دکتر و بهداشت","اسنپ","قبض","اجاره","درمان","تفریح","سایر"];
const key="home_expenses_v1";
const fa=n=>new Intl.NumberFormat("fa-IR").format(Number(n)||0);
const today=new Date();
document.getElementById("date").value=today.toISOString().slice(0,10);
document.getElementById("month").value=today.toISOString().slice(0,7);
document.getElementById("category").innerHTML=cats.map(x=>`<option>${x}</option>`).join("");
function get(){return JSON.parse(localStorage.getItem(key)||"[]")}
function save(x){localStorage.setItem(key,JSON.stringify(x))}
function show(which){document.getElementById("form").classList.toggle("hidden",which!=="form");document.getElementById("report").classList.toggle("hidden",which!=="report");window.scrollTo({top:0,behavior:"smooth"});render()}
function addExpense(){
 let amount=Number(document.getElementById("amount").value);
 if(!amount){toast("مبلغ را وارد کنید");return}
 let x=get(); x.push({date:date.value,amount,category:category.value,note:note.value.trim(),created:Date.now()}); save(x);
 clearForm(); toast("هزینه ثبت شد"); render();
}
function clearForm(){amount.value="";note.value="";category.selectedIndex=0;date.value=new Date().toISOString().slice(0,10)}
function render(){
 let m=month.value, x=get().filter(e=>e.date.startsWith(m));
 let total=x.reduce((s,e)=>s+e.amount,0); document.getElementById("total").textContent=fa(total);
 let sums=cats.map(c=>[c,x.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0)]).filter(a=>a[1]>0).sort((a,b)=>b[1]-a[1]);
 let max=sums[0]?.[1]||1;
 document.getElementById("categories").innerHTML=sums.length?sums.map(a=>`<div class="row"><div style="flex:1"><b>${a[0]}</b><div class="bar"><span style="width:${Math.max(3,a[1]/max*100)}%"></span></div></div><div class="amount">${fa(a[1])}</div></div>`).join(""):"<div class='muted'>برای این ماه هزینه‌ای ثبت نشده است.</div>";
 let all=get().sort((a,b)=>b.created-a.created).slice(0,8);
 document.getElementById("recent").innerHTML=all.length?all.map(e=>`<div class="row"><div><b>${e.category}</b><br><span class="small">${e.date}${e.note?" — "+e.note:""}</span></div><div class="amount">${fa(e.amount)}</div></div>`).join(""):"<div class='muted'>هنوز هزینه‌ای ثبت نشده است.</div>";
}
function downloadCSV(){
 let rows=[["تاریخ","مبلغ","نوع هزینه","توضیحات"],...get().map(e=>[e.date,e.amount,e.category,e.note])];
 let csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
 let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="مصارف-خانه.csv";a.click();URL.revokeObjectURL(a.href);
}
function clearAll(){if(confirm("همه اطلاعات این گوشی حذف شود؟")){localStorage.removeItem(key);render();toast("اطلاعات حذف شد")}}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
